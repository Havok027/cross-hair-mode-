name: Build

on:
  push:
    branches: [main, mauro-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crosshair-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verificar se a versão precisa de uma release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A versão v$VERSION já foi publicada. O ZIP novo ficará nos artefatos desta execução; a release existente será preservada."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Permite enviar os arquivos soltos (ex.: pelo celular): o que for
      # TypeScript vai para src/, e o repositório fica organizado em pastas.
      - name: Organizar arquivos em pastas
        run: |
          mkdir -p src
          for f in *.ts *.tsx; do
            if [ -f "$f" ]; then mv -f "$f" src/; fi
          done
          if [ -f gitignore.txt ]; then mv -f gitignore.txt .gitignore; fi
          rm -f build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Organizar arquivos em pastas"
            git push
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:backend
      - run: pnpm build
      - name: Montar a pasta do plugin
        run: |
          mkdir -p out/Crosshair
          cp -r dist main.py plugin.json package.json README.md README.en.md README.es.md LICENSE out/Crosshair/
          cd out && zip -r ../Crosshair.zip Crosshair
      - name: Validar ZIP com o Direct Updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/check_direct_updater.py Crosshair.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Crosshair
          path: out
      - name: Publicar release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          [ -f RELEASE_NOTES.md ] || echo "Plugin compilado, pronto para instalar pelo Decky (Instalar plugin de ZIP)." > RELEASE_NOTES.md
          gh release create "$TAG" Crosshair.zip \
            --target "$(git rev-parse HEAD)" \
            --title "Crosshair $TAG" \
            --notes-file RELEASE_NOTES.md \
            --latest
      - name: Verificar download e SHA-256 pelo Direct Updater
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          python tests/check_direct_updater.py --repo "${{ github.repository }}" --version "$VERSION"
